<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم عيادة الياسين</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== تنسيقات خاصة بلوحة التحكم ===== */
    .dashboard-container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: var(--white);
      padding: 40px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .login-box h2 { color: var(--primary-dark); margin-bottom: 30px; }
    .login-box .form-group { margin-bottom: 20px; text-align: right; }
    .hidden { display: none !important; }
    
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .btn-logout {
      background: var(--danger);
      color: var(--white);
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }
    .btn-logout:hover { background: #c82333; }

    /* ===== بطاقات الإحصائيات الجديدة ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--white);
      padding: 25px;
      border-radius: 15px;
      box-shadow: var(--shadow);
      text-align: center;
      border-top: 4px solid var(--primary);
    }
    .stat-card.pending { border-top-color: #ffc107; }
    .stat-card.approved { border-top-color: var(--success); }
    .stat-card.rejected { border-top-color: var(--danger); }
    
    .stat-number {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin: 10px 0;
    }
    .stat-label {
      color: var(--text-light);
      font-weight: 600;
    }

    /* ===== شريط البحث والفلترة ===== */
    .controls-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      background: var(--white);
      padding: 20px;
      border-radius: 15px;
      box-shadow: var(--shadow);
    }
    .search-box {
      flex: 1;
      min-width: 250px;
      padding: 10px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    .search-box:focus { outline: none; border-color: var(--primary); }
    
    .filter-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 18px;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--primary);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: var(--white);
    }

    /* ===== الجدول ===== */
    .table-container {
      background: var(--white);
      border-radius: 15px;
      box-shadow: var(--shadow);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th, td { padding: 15px; text-align: right; border-bottom: 1px solid #eee; }
    th { background: var(--bg-light); color: var(--primary-dark); font-weight: 700; }
    
    .status-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .status-pending { background: #fff3cd; color: #856404; }
    .status-approved { background: #d4edda; color: #155724; }
    .status-rejected { background: #f8d7da; color: #721c24; }
    
    .action-btn {
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 5px;
      color: white;
      transition: 0.2s;
    }
    .btn-approve { background: var(--success); }
    .btn-approve:hover { background: #218838; }
    .btn-reject { background: var(--danger); }
    .btn-reject:hover { background: #c82333; }
    .btn-delete { background: #6c757d; }
    .btn-delete:hover { background: #5a6268; }
    
    .loading { text-align: center; padding: 40px; color: var(--text-light); }
    .error-msg { color: var(--danger); margin-top: 10px; font-size: 0.9rem; }

    @media (max-width: 768px) {
      .controls-bar { flex-direction: column; }
      .filter-buttons { justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- ===== شاشة تسجيل الدخول ===== -->
  <div id="loginSection" class="login-box">
    <h2>🔐 دخول د. سجاد ياسين</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">دخول</button>
      <div id="loginError" class="error-msg"></div>
    </form>
  </div>

  <!-- ===== لوحة التحكم ===== -->
  <div id="dashboardSection" class="dashboard-container hidden">
    <div class="dashboard-header">
      <h2>📋 إدارة حجوزات العيادة</h2>
      <button id="logoutBtn" class="btn-logout">تسجيل خروج</button>
    </div>

    <!-- بطاقات الإحصائيات -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">إجمالي الحجوزات</div>
        <div class="stat-number" id="statTotal">0</div>
      </div>
      <div class="stat-card pending">
        <div class="stat-label">قيد الانتظار</div>
        <div class="stat-number" id="statPending">0</div>
      </div>
      <div class="stat-card approved">
        <div class="stat-label">مقبولة</div>
        <div class="stat-number" id="statApproved">0</div>
      </div>
      <div class="stat-card rejected">
        <div class="stat-label">مرفوضة</div>
        <div class="stat-number" id="statRejected">0</div>
      </div>
    </div>

    <!-- شريط التحكم (بحث + فلترة) -->
    <div class="controls-bar">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث باسم المريض أو رقم الهاتف...">
      <div class="filter-buttons">
        <button class="filter-btn active" data-status="all">الكل</button>
        <button class="filter-btn" data-status="pending">قيد الانتظار</button>
        <button class="filter-btn" data-status="approved">مقبول</button>
        <button class="filter-btn" data-status="rejected">مرفوض</button>
      </div>
    </div>

    <!-- جدول الحجوزات -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>المريض</th>
            <th>الهاتف</th>
            <th>الخدمة</th>
            <th>التاريخ والوقت</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="appointmentsTableBody">
          <tr><td colspan="6" class="loading">جاري تحميل الحجوزات...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
